services:
  postgres-tgt:
    image: postgres:15-alpine
    container_name: bd-postgres-tgt
    environment:
      POSTGRES_USER: ${POSTGRES_TGT_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TGT_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_TGT_DB:-postgres}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${POSTGRES_TGT_PORT:-5433}:5432"
    volumes:
      - postgres_tgt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bigdata
